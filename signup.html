<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVET Nexus |ICT HUB</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css.css">
</head>
<body>
    <div class="form_details">
    <h1>Student Signup</h1>
    <p>Register for free to track your  progress</p>

      <div class="form-input">

        <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" required placeholder="Enter Your username">
        </div>
         <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" placeholder="Enter your Email" required>
         </div>
           <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" required placeholder="Enter password">
           </div>
          <button>Sign up</button>
          <p>Already have an account?<a href="">Log in</a></p>
      </div>
    </div>
    
</body>
</html>
