<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVET AI Assistant</title>
    <link rel="stylesheet" href="tutor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>

    <div class="main-tutor">

        <h1>
            <i class="fa-solid fa-robot"></i>
            TVET AI Assistant
        </h1>

        <div class="tutor">

            <div class="welcome">
                <i class="fa-solid fa-robot"></i>
                <h3>Hello! Welcome to TVET AI Assistant.</h3>
                <p>Ask anything. I'm here to help you learn.</p>
            </div>

            <div class="chat-messages">
                <!-- AI and student messages will appear here -->
            </div>

            <div class="chat-input">
                <textarea
                    placeholder="Ask anything I can help you with..."
                    rows="2">
                </textarea>

                <button type="button">
                    <i class="fa-solid fa-paper-plane"></i>
                    Send
                </button>
            </div>

        </div>

    </div>
</body>
</html>
